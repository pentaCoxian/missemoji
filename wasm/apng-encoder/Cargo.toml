[package]
name = "apng-encoder"
version = "0.1.0"
edition = "2021"
description = "Browser WASM APNG encoder with changed-region delta optimization for missemoji"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
apng = "0.3.4"
png = "0.17"
wasm-bindgen = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# wasm-pack passes these to wasm-opt. Newer rustc emits bulk-memory ops; enable
# them (all 2026 browsers support bulk memory) so the optimize pass validates.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-bulk-memory"]
